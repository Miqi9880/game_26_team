# Production model profile: sp_vision_25 assets yolov5 armor detector.
# Origin: TongjiSuperPower/sp_vision_25 (public) assets/yolov5.xml + .bin.
# Contract matches the checked-in test profile exactly (22-channel NRC layout)
# and the tutorial parse code (lecture3 YOLOV5::parse: kp@0-7, obj@8, color@9-12, armor@13-21).
# Acquired on Orin 2026-08-31; SHA-256 verified (see artifacts).
schema_version: 2
profile: production

model:
  id: sp25_yolov5_armor
  source: TongjiSuperPower/sp_vision_25 assets/yolov5
  version: 2025-season-assets-v1
  format: openvino_ir
  artifacts:
    xml:
      path: /home/nvidia/game_26_orin_main/models/yolov5.xml
      sha256: 1cf9f2eb20e0312e8277ec457cfc67fb6867c4ff634d337c9c441a6aea052f8a
    bin:
      path: /home/nvidia/game_26_orin_main/models/yolov5.bin
      sha256: aeae1db78494b631ddc1420a04714608b5dcf8bdf11f360ce503309757b1a7de

input:
  shape: [1, 3, 640, 640]
  layout: NCHW
  element_type: f32
  source_color_order: BGR
  model_color_order: RGB
  normalization: divide_255
  resize_mode: top_left

output:
  shape: [1, 25200, 22]
  layout: NRC
  element_type: f32
  keypoint_count: 4
  objectness_index: 8
  color_logits_offset: 9
  color_class_count: 4
  armor_logits_offset: 13
  armor_class_count: 9

postprocess:
  objectness_threshold: 0.7
  nms_threshold: 0.3
  # Raw model coordinate pairs are reordered to TL,TR,BR,BL.
  keypoint_order: [0, 3, 2, 1]

semantics:
  # Class order below is the tutorial/dataset convention (ARMOR_NAMES /
  # Color order from lecture3 armor.hpp). Confirm against the training labels.
  color_id_to_name: [blue, red, extinguish, purple]
  armor_class_names: [one, two, three, four, five, sentry, outpost, base, not_armor]
  # one..five/sentry/outpost are small armor; base is the big base-station armor.
  class_to_armor_type:
    0: small
    1: small
    2: small
    3: small
    4: small
    5: small
    6: small
    7: big
    8: small

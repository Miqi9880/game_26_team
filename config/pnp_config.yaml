# Production PnP configuration (2026-08-31).
# - camera K/D: calibrated 2026-08-31, 97/97 views RMS 0.1478px, serial
#   DA4302286, lens MV-CS016-10UC (10 mm); matches
#   src/ros2-hik-camera/config/camera_info_calibrated.yaml.
# - armor sizes: measured on the competition plates 2026-08-31 (outer frame,
#   same rectangle the detector keypoints mark).  Verify once on the venue at
#   a known 3 m distance: solved range should read ~3.0 m.
# - camera_to_gimbal: NOT hand-eye calibrated (calibration deferred).  R is the
#   mechanical-assumption orthogonal mounting; t is an estimate to be measured
#   on the venue.  Verify at a known 3 m distance: solved range ~3.0 m and the
#   gimbal should point at the plate; adjust t (and R only if skew is visible)
#   before the ladder matches.
schema_version: 1
profile: production

camera:
  image_width: 1440
  image_height: 1080
  camera_matrix: [1814.1656271049733, 0.0, 724.71855849275437,
                  0.0, 1813.46032716116, 575.90169989101173,
                  0.0, 0.0, 1.0]
  distortion_coefficients: [-0.089388401646495072, 2.9512707432545957,
                            -0.00179825173144803, -0.0013181919073637981,
                            -1.0665972873590799]
  source: camera_info_calibrated.yaml DA4302286 MV-CS016-10UC 10mm
  version: 2026-08-31-calibration-v1
  coordinate_frame: opencv_camera_optical

armor_geometry:
  corner_order: [top_left, top_right, bottom_right, bottom_left]
  small:
    width_m: 0.135
    height_m: 0.125
    object_points_m:
      [[-0.0675, -0.0625, 0.0], [0.0675, -0.0625, 0.0],
       [0.0675, 0.0625, 0.0], [-0.0675, 0.0625, 0.0]]
    source: measured 2026-08-31 competition plate outer frame
    version: measured-v1
    object_frame: armor_local_x_right_y_down_z_forward
  large:
    width_m: 0.230
    height_m: 0.127
    object_points_m:
      [[-0.115, -0.0635, 0.0], [0.115, -0.0635, 0.0],
       [0.115, 0.0635, 0.0], [-0.115, 0.0635, 0.0]]
    source: measured 2026-08-31 competition plate outer frame
    version: measured-v1
    object_frame: armor_local_x_right_y_down_z_forward

# Must match config/model_profile.yaml (sp25_yolov5_armor) exactly:
# base=7 is the large plate per the upstream ARMOR_NAMES convention.
class_to_armor_type:
  0: small
  1: small
  2: small
  3: small
  4: small
  5: small
  6: small
  7: large
  8: small

pnp:
  method: ITERATIVE
  max_reprojection_error_px: 3.0

camera_to_gimbal:
  configured: true
  # Extrinsic borrowed from the Tongji (TJU) hand-eye calibration
  # (reprojection RMS 0.1820 px); NOT measured on this vehicle.  Its frame
  # convention matches ours: camera +x right / +y down / +z front maps to
  # gimbal +x front / +y left / +z up (verified: columns of R are the camera
  # axes in the gimbal frame, proper rotation det=+1).  Camera intrinsics
  # above remain ours (DA4302286, RMS 0.1478 px).  MUST re-verify on the
  # venue at a known 3 m distance: solved range ~3.0 m and aim at the plate;
  # re-calibrate or adjust before the ladder matches.
  rotation_gimbal_from_camera: [-0.027182119030230909, -0.12616154330853446,
                                0.99163723074269183, -0.99949106557517331,
                                0.019998323121329122, -0.024853106601381177,
                                -0.016695575474690555, -0.99180811252093692,
                                -0.12664093215554434]
  translation_gimbal_from_camera_m: [0.13160669975045827, 0.10377721766577375,
                                     0.024908271912914642]
  source: tongji-tju-hand-eye-borrowed-2026-08-31 (not measured on this vehicle)
  version: borrowed-tju-v1
  source_frame: opencv_camera_optical
  target_frame: gimbal_x_forward_y_left_z_up
